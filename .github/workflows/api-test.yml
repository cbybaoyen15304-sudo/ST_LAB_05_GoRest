
name: API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      
      - name: Run API tests
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run Collection.json \
            -e Environment.json \
            --env-var "baseUrl=https://gorest.co.in/public/v2" \
            --env-var "token=$GOREST_TOKEN" \
            -d users.csv

